<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas Moderna</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body class="bg-body text-body-secondary min-vh-100 py-4">

    <div class="container" style="max-width: 800px;">
        <!-- Header -->
        <header class="text-center mb-5">
            <h1 class="fw-bold text-light mb-2"><i class="bi bi-check2-square text-primary me-2"></i>Mis Tareas</h1>
            <p class="text-muted">Organiza tus actividades de manera eficiente y moderna</p>
        </header>

        <!-- Form Card -->
        <div class="card bg-dark border-0 rounded-4 shadow-lg p-4 mb-5">
            <h4 class="text-light mb-3 fw-semibold"><i class="bi bi-plus-circle me-2"></i>Nueva Tarea</h4>
            <form id="taskForm" class="row g-3">
                <div class="col-12">
                    <label for="asunto" class="form-label text-light small fw-medium">Asunto</label>
                    <input type="text" class="form-control bg-secondary bg-opacity-25 border-0 text-light rounded-3 shadow-none" id="asunto" placeholder="¿Qué necesitas hacer?" required>
                </div>

                <div class="col-md-4">
                    <label for="tema" class="form-label text-light small fw-medium">Tema / Categoría</label>
                    <select class="form-select bg-secondary bg-opacity-25 border-0 text-light rounded-3 shadow-none" id="tema" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Salud">Salud</option>
                        <option value="Estudio">Estudio</option>
                        <option value="Comida">Comida</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="dificultad" class="form-label text-light small fw-medium">Dificultad</label>
                    <select class="form-select bg-secondary bg-opacity-25 border-0 text-light rounded-3 shadow-none" id="dificultad" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="plazo" class="form-label text-light small fw-medium">Plazo / Fecha límite</label>
                    <input type="date" class="form-control bg-secondary bg-opacity-25 border-0 text-light rounded-3 shadow-none" id="plazo" required>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 rounded-3 fw-semibold py-2 shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Agregar Tarea
                    </button>
                </div>
            </form>
        </div>

        <!-- Task List Container -->
        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-light fs-5 fw-semibold mb-0">Tareas Registradas</h3>
                <span id="taskCount" class="badge bg-secondary bg-opacity-50 text-light rounded-pill px-3 py-2">0 tareas</span>
            </div>
            
            <div id="taskList" class="row g-3">
                <!-- Las tarjetas se insertarán dinámicamente aquí -->
            </div>
        </section>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./aprender.js"></script>
</body>
</html>
